name: Build & Bundle Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'static/releases/**'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: SvelteKit → Capacitor → Gradle → APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Python 3.12 (kernel parity gate)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Kernel parity gate (Python ↔ JS, 0.01° tolerance)
        run: node scripts/kernel-parity.mjs

      - name: Build SvelteKit static bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install Capacitor toolchain
        run: npm install --no-save @capacitor/cli@^6 @capacitor/core@^6 @capacitor/android@^6

      - name: Capacitor sync (build/ → android/app/src/main/assets/public)
        # Sync is additive: the checked-in Kotlin bridge, MainActivity and
        # AndroidManifest are authoritative and are NOT regenerated.
        run: npx cap sync android

      - name: Grant gradlew execute bit
        run: chmod +x android/gradlew || true

      - name: Gradle assembleRelease
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew missing — generating wrapper"
            gradle wrapper --gradle-version 8.7
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g'

      - name: Locate & rename artifact
        id: artifact
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "no APK produced"; exit 1; fi
          mkdir -p static/releases public/releases
          cp "$APK" static/releases/helioforge-release.apk
          cp "$APK" public/releases/helioforge-release.apk
          cp "$APK" "static/releases/HelioForge-SolarAR-v1.0.0.apk"
          SIZE=$(stat -c%s static/releases/helioforge-release.apk)
          SHA=$(sha256sum static/releases/helioforge-release.apk | cut -d' ' -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### HelioForge APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- size: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: helioforge-apk
          path: static/releases/*.apk
          retention-days: 90

      - name: Commit APK into the deploy bundle
        run: |
          git config user.name  "helioforge-ci"
          git config user.email "ci@helioforge.app"
          git add -f static/releases/*.apk public/releases/*.apk
          git commit -m "ci: bundle HelioForge v1.0.0-arm64 APK (${{ steps.artifact.outputs.size }} bytes)" || echo "nothing to commit"
          git push

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-arm64-${{ github.run_number }}
          name: HelioForge v1.0.0-arm64 (build ${{ github.run_number }})
          body: |
            **HelioForge** — Optical AR Solar Heliodon × Off-Grid Battery Forge
            Stack: Svelte 5 · Python 3.12 · GLSL ES 3.00 · Kotlin
            SHA-256: `${{ steps.artifact.outputs.sha }}`
          files: static/releases/helioforge-release.apk
          fail_on_unmatched_files: false
