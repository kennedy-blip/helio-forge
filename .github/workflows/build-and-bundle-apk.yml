name: Build & Bundle Android APK

# Builds the signed-but-debug-keyed release APK, commits it into the static
# deploy bundle, publishes a GitHub Release, and then asks Vercel to redeploy so
# the one-tap download button serves the real binary.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'static/releases/**'
      - 'public/releases/**'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APK_STEM: helioforge-release

jobs:
  apk:
    name: SvelteKit → Capacitor → Gradle → APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The bundle commit below pushes back to the same branch.
          persist-credentials: true

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on ubuntu-latest)
        # Deliberately not android-actions/setup-android: it is a node16-era
        # action and failed here within 21 s. The runner image already ships
        # ANDROID_HOME with cmdline-tools and platform-tools, which is all AGP
        # needs; install platform 34 only if the image predates it.
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::no Android SDK at $SDK (ANDROID_HOME unset)"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMGR=""
          for candidate in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager"; do
            [ -x "$candidate" ] && SDKMGR="$candidate" && break
          done
          if [ -z "$SDKMGR" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools"   >> "$GITHUB_PATH"

          echo "--- already present ---"
          ls "$SDK/platforms" 2>/dev/null || true

          # compileSdk 34 is required by android/build.gradle.
          if [ ! -d "$SDK/platforms/android-34" ]; then
            echo "--- installing platform 34 + build-tools 34.0.0 ---"
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0"
          else
            echo "platform 34 present"
          fi
          "$SDKMGR" --list_installed 2>/dev/null | head -20 || true

      # The repo deliberately does not commit gradle-wrapper.jar: it is a
      # binary that cannot be checksum-verified from CI, and AGP 8.5.2 already
      # pins Gradle 8.7. Provision that exact version instead.
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Python 3.12 (kernel parity gate)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Kernel parity gate (Python ↔ JS, 0.01° tolerance)
        run: node scripts/kernel-parity.mjs

      - name: Cloud sync contract
        run: node scripts/cloud-contract.mjs

      - name: APK release contract (icons, asset names, tag, one-tap honesty)
        # Fails fast on the class of bug that costs 6 minutes of Gradle before
        # :processReleaseResources rejects a missing mipmap.
        run: node scripts/apk-release.mjs

      # Compiling Kotlin is the slowest failure mode to discover; do it against
      # an empty asset payload first so a type error surfaces in ~30 s instead of
      # after a full web build. ICONS/resources/manifest are all in the repo.
      - name: Kotlin compile gate (fail fast)
        id: kotlin
        working-directory: android
        shell: bash
        run: |
          mkdir -p app/src/main/assets/public
          [ -f app/src/main/assets/capacitor.config.json ] || \
            printf '{"appId":"com.helioforge.solar","appName":"HelioForge","webDir":"build"}' \
            > app/src/main/assets/capacitor.config.json
          set +e
          gradle :app:compileReleaseKotlin --no-daemon --console=plain 2>&1 | tee /tmp/kotlin.log
          exit ${PIPESTATUS[0]}

      - name: Surface Kotlin failure as annotations
        if: failure() && steps.kotlin.outcome == 'failure'
        shell: bash
        run: |
          set -uo pipefail
          sed -e 's/\x1b\[[0-9;]*m//g' /tmp/kotlin.log 2>/dev/null \
            | grep -E '^e: |^w: |error:|FAILURE:|What went wrong|Execution failed' \
            | head -12 \
            | while IFS= read -r line; do
                safe=${line//'%'/'%25'}
                safe=${safe//$'\r'/''}
                echo "::error title=Kotlin::${safe}"
              done
          exit 1

      - name: Build SvelteKit static bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Capacitor sync (build/ → android/app/src/main/assets/public)
        # Sync is additive: the checked-in Kotlin bridge, MainActivity,
        # AndroidManifest and launcher icons are authoritative.
        run: npx cap sync android

      - name: Gradle assembleRelease
        id: gradle
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee /tmp/gradle.log
          exit ${PIPESTATUS[0]}
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g'

      - name: Surface Gradle failure as annotations
        # The build log is served from blob storage, which is not reachable from
        # every environment. Re-emit the actionable lines as check annotations so
        # a failure is diagnosable from the PR page alone.
        if: failure() && steps.gradle.outcome == 'failure'
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/gradle.log
          if [ ! -s "$LOG" ]; then echo "no gradle log captured"; exit 1; fi

          # Strip ANSI escapes, then pull only the lines that name a cause.
          sed -e 's/\x1b\[[0-9;]*m//g' "$LOG" \
            | grep -E '^e: |^w: |error:|FAILURE:|What went wrong|Execution failed|^> Task .* FAILED|Caused by|A problem occurred|Could not (resolve|find|compile)|Unresolved reference|missing|not found' \
            | grep -v '^\s*$' \
            | head -12 \
            | while IFS= read -r line; do
                # Annotations treat these characters as delimiters.
                safe=${line//'%'/'%25'}
                safe=${safe//$'\r'/''}
                echo "::error title=Gradle::${safe}"
              done

          {
            echo '### Gradle failure'
            echo '```'
            sed -e 's/\x1b\[[0-9;]*m//g' "$LOG" | tail -70
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Verify artifact is a real installable APK
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::Gradle produced no APK"; exit 1; fi

          # An APK is a ZIP: refuse anything that is not, so a truncated or
          # placeholder artifact can never reach the download button.
          if ! head -c 2 "$APK" | grep -q 'PK'; then
            echo "::error::$APK is not a valid ZIP/APK"; exit 1
          fi

          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK is only $SIZE bytes — refusing to publish"
            exit 1
          fi

          mkdir -p static/releases
          cp "$APK" "static/releases/${APK_STEM}.apk"

          SHA=$(sha256sum "static/releases/${APK_STEM}.apk" | cut -d' ' -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"  >> "$GITHUB_OUTPUT"

          {
            echo "### HelioForge APK"
            echo ""
            echo "- source: \`$APK\`"
            echo "- size: $SIZE bytes"
            echo "- sha256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: helioforge-apk
          path: static/releases/*.apk
          retention-days: 90

      - name: Commit APK into the deploy bundle
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "helioforge-ci"
          git config user.email "ci@helioforge.app"
          # Drops the legacy public/releases copy if an older run created one.
          git rm -r --ignore-unmatch --cached public/releases >/dev/null 2>&1 || true
          git add -f "static/releases/${APK_STEM}.apk"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "ci: bundle HelioForge v1.0.0-arm64 APK (${{ steps.artifact.outputs.size }} bytes)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Must match APK_NAME in src/lib/components/modals/ApkModal.svelte.
          tag_name: HelioForge-SolarAR-v1.0.0
          name: HelioForge SolarAR v1.0.0 (arm64-v8a · armeabi-v7a)
          body: |
            **HelioForge** — Optical AR Solar Heliodon × Off-Grid Battery Forge
            Stack: Svelte 5 · Python 3.12 · GLSL ES 3.00 · Kotlin

            - Package: `com.helioforge.solar`
            - Min Android: API 24 (7.0), target 34
            - SHA-256: `${{ steps.artifact.outputs.sha }}`

            This release is signed with the CI debug keystore, so it installs
            via sideload but is not Play Store distributable.
          files: static/releases/helioforge-release.apk
          fail_on_unmatched_files: true

      - name: Redeploy Vercel so one-tap download serves the new APK
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        shell: bash
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
